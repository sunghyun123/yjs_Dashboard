<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YJS 운영 홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0b3a67">
    <style>
        :root {
            --y-bg: #f4f7fb;
            --y-card: #ffffff;
            --y-primary: #1e4f87;
            --y-border: #dbe5f0;
            --y-text-subtle: #5f6f82;
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--y-bg);
            font-family: 'Malgun Gothic', sans-serif;
            color: #172230;
            overflow: hidden; /* 1600x900 한 화면 고정 */
        }

        .home-header {
            background: linear-gradient(110deg, #0b3a67, #1a5895);
            color: #fff;
            padding: 8px 0;
            box-shadow: 0 3px 14px rgba(8, 31, 58, 0.2);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
        }

        .header-title {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1;
            transform: skewX(-12deg);
            display: inline-block;
            background: linear-gradient(180deg, #ff5a46 0%, #e32727 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 80, 60, 0.28);
        }

        .top-nav-shell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            background: rgba(7, 28, 52, 0.24);
        }

        .top-nav-label {
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1;
        }

        .app-top-nav {
            display: inline-flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .app-top-nav .btn {
            border-radius: 999px;
            font-size: 0.76rem;
            padding: 3px 11px;
            min-width: 70px;
            font-weight: 700;
        }

        .app-top-nav .btn:hover {
            transform: translateY(-1px);
        }

        .home-shell {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 14px 12px;
        }

        /* ── 홈 배치 (2026-11-12 연간 PR-3, 1600×900 기준) ──
           왼쪽 바로가기 170px | 오른쪽(위: 공정률+날씨 / 아래: 표 칸).
           아래 칸이 더 큰 이유: PR-4 1~12월 표(접힘 4줄 → 펼침 약 13행)가 들어올 자리 */
        .home-grid {
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr);
            gap: 8px;
            height: 100%;
        }
        .home-right {
            display: grid;
            grid-template-rows: minmax(0, 46fr) minmax(0, 54fr);
            gap: 8px;
            min-height: 0;
        }
        .home-top {
            display: flex;
            gap: 8px;
            min-height: 0;
        }
        .home-top-main { flex: 1 1 auto; min-width: 0; min-height: 0; }
        .home-table-slot { min-height: 0; overflow: auto; }
        /* 월 표(임시)가 넓은 칸에서 1400px로 늘어나 숫자가 멀어지지 않게 */
        .home-table-slot .pa-table { max-width: 640px; }

        /* 바로가기 세로 한 열 — 아이콘 + 이름 가로 한 줄 */
        .shortcut-col { min-height: 0; }
        .shortcut-col .mini-link-grid { grid-template-columns: 1fr; gap: 6px; }
        .shortcut-col .mini-link {
            display: flex; align-items: center; gap: 8px;
            text-align: left; padding: 7px 10px; font-size: 0.8rem;
        }
        .shortcut-col .mini-link-favicon,
        .shortcut-col .mini-link-icon-fallback { margin: 0; flex: 0 0 auto; }

        /* 날씨 소형 */
        .weather-mini { flex: 0 0 180px; min-height: 0; }
        .weather-mini .weather-now { gap: 8px; margin-bottom: 4px; }

        .home-card {
            border: 1px solid var(--y-border);
            border-radius: 14px;
            background: var(--y-card);
            box-shadow: 0 3px 10px rgba(13, 41, 69, 0.06);
        }

        .section-title {
            font-size: 0.94rem;
            font-weight: 700;
            color: #1f3045;
        }

        /* ── 계획/실적 표 (PR-3) ── */
        .pa-nav { display: inline-flex; align-items: center; gap: 6px; }
        .pa-nav-btn { width: 30px; height: 30px; border: 1px solid #c9d6e4; border-radius: 8px; background: #fff; color: #1f3045; font-size: 1rem; line-height: 1; }
        .pa-nav-btn:disabled { border-color: #e3ebf4; background: #f4f7fb; color: #b3c0cf; }
        .pa-nav-month { min-width: 56px; text-align: center; font-weight: 800; font-size: 1rem; color: #1f3045; }
        .pa-period { font-size: 0.74rem; color: #5b6f86; margin-bottom: 6px; }
        .pa-table { display: grid; grid-template-columns: 44px 1fr 1fr 64px; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .pa-table > div { padding: 10px 4px; border-top: 1px solid #eef3f8; text-align: right; color: #2c3e55; }
        .pa-table > .pa-h { border-top: 0; border-bottom: 1px solid #dbe4ee; padding: 4px; font-size: 0.78rem; color: #5b6f86; }
        .pa-table > .pa-k { text-align: left; font-weight: 800; }
        .pa-table > .pa-k.construction { color: #1f6fd6; }
        .pa-table > .pa-k.settlement { color: #2b8a3e; }
        .pa-table > .pa-rate { font-weight: 800; color: #1f3045; }
        .pa-table .pa-fail { color: #b42318; font-weight: 700; }
        .pa-table .pa-dim { color: #8a99ab; }
        .pa-notice { margin-top: 8px; font-size: 0.78rem; color: #b42318; background: #fdecea; border-radius: 8px; padding: 6px 8px; }

        /* ── 현장 날씨 ── */
        .weather-now {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(120deg, #eaf3fb, #f4f9ff);
            border: 1px solid #d9e8f5;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .weather-icon { font-size: 2.4rem; line-height: 1; }
        .weather-temp { font-size: 1.85rem; font-weight: 800; color: #143656; line-height: 1; }
        .weather-cond { font-size: 0.8rem; color: #4a647e; margin-top: 2px; }

        /* ── 총 공정률 도넛 ── */
        /* 이중 링: 바깥 = 시공 / 시공 목표, 안쪽 = 정산 / 정산 목표.
           남은 몫은 두 링 모두 같은 회색 트랙 — 주황 '미달성'을 두 번 쓰면 어느 링의 미달성인지 또 헷갈린다. */
        .total-progress-donut {
            --progress: 0;
            --settle: 0;
            --track: #e8eef5;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            background: conic-gradient(#2f8df7 calc(var(--progress) * 1%), var(--track) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .total-progress-donut::before {
            content: "";
            width: 82%;
            height: 82%;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            z-index: 1;
        }

        .total-progress-inner {
            position: absolute;
            width: 76%;
            height: 76%;
            border-radius: 50%;
            background: conic-gradient(#2f9e44 calc(var(--settle) * 1%), var(--track) 0);
            z-index: 2;
        }

        .total-progress-inner::before {
            content: "";
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            background: #ffffff;
        }

        /* 정산을 못 그리는 상태(대체값 화면)에서는 안쪽 링을 통째로 감춘다 — 빈 트랙은 '정산 0%'로 읽힌다 */
        .total-progress-donut.no-settle .total-progress-inner { display: none; }

        .total-progress-center {
            position: relative;
            z-index: 3;
            text-align: center;
            line-height: 1.2;
        }

        .tp-center-row { white-space: nowrap; }
        .tp-center-row .k { font-size: 0.78rem; font-weight: 700; color: #62758b; margin-right: 3px; }
        .total-progress-value { font-size: 1.35rem; font-weight: 800; color: #1f5fb8; }
        .total-progress-settle { font-size: 1.15rem; font-weight: 800; color: #25803a; }

        .total-progress-legend {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 7px;
            font-size: 0.76rem;
            color: #4f6278;
        }

        .dot-chip {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            transform: translateY(-1px);
        }

        .dot-chip.construction { background: #2f8df7; }
        .dot-chip.settlement { background: #2f9e44; }

        .total-progress-caption {
            font-size: 0.8rem;
            color: #5f6f82;
            text-align: center;
            margin-top: 6px;
            line-height: 1.55;
        }

        /* ── 총 공정률 카드(중앙): 왼쪽 도넛 + 오른쪽 담당자별 진척 ── */
        .tp-split { display: flex; gap: 18px; flex: 1 1 auto; min-height: 0; }
        .tp-split-donut { flex: 0 0 240px; display: flex; flex-direction: column; justify-content: center; }
        .tp-split-managers { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid #e3ebf4; padding-left: 16px; }
        .mgr-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: #1f3045; margin-bottom: 8px; }
        .mgr-legend { font-size: 0.8rem; color: #4f6278; }
        /* 담당자 칸들이 카드 높이를 나눠 갖는다 — 아래 여백이 남지 않게(칸이 많아 넘치면 그때 스크롤) */
        .mgr-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 2px; display: flex; flex-direction: column; gap: 8px; }
        .mgr-row { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 4px; border: 1px solid #e3ebf4; border-radius: 10px; background: #f9fbff; padding: 8px 12px; }
        .mgr-row.unassigned { background: #fff; border-style: dashed; }
        .mgr-name { font-size: 1rem; font-weight: 800; color: #1f3045; display: flex; align-items: center; gap: 7px; }
        .mgr-name i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .mgr-line { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 0.9rem; color: #4f6278; }
        .mgr-bar { height: 12px; border-radius: 999px; background: #e8eef5; overflow: hidden; }
        .mgr-bar span { display: block; height: 100%; border-radius: 999px; background: #2f8df7; }
        .mgr-line.settlement .mgr-bar span { background: #2f9e44; }
        .mgr-val { font-variant-numeric: tabular-nums; white-space: nowrap; color: #2c3e55; font-weight: 600; }
        .mgr-val b { color: #1f3045; font-size: 1.02rem; margin-right: 6px; }
        .mgr-bar { position: relative; overflow: visible; }
        .mgr-bar > span { overflow: hidden; }
        .mgr-goal { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: #1f3045; border-radius: 1px; }
        .mgr-unplanned { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 0.88rem; color: #4f6278; padding: 6px 10px; border: 1px dashed #d5dfeb; border-radius: 10px; }
        .mgr-unplanned b { color: #1f3045; font-variant-numeric: tabular-nums; }
        .mgr-name-sm { font-weight: 800; color: #1f3045; }
        /* 담당자 줄 안의 누르는 숫자 — 칸이 좁아 캡션용 여백을 줄인다 */
        .mgr-val .tp-clickable, .mgr-unplanned .tp-clickable { padding: 0 3px; margin: 0; }
        .mgr-val .tp-clickable::after, .mgr-unplanned .tp-clickable::after { margin-left: 2px; }

        /* ── 총 공정률 상세 팝업 (실적/목표 캡션 클릭) ── */
        /* 캡션 줄을 '눌러도 되는 글자'로 보이게 한다 — 안 그러면 클릭할 수 있는 줄 알 방법이 없다 */
        .tp-clickable {
            display: inline-block;
            cursor: pointer;
            padding: 1px 6px;
            margin: 1px 0;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: background .12s, border-color .12s;
            white-space: nowrap;
        }

        .tp-clickable:hover,
        .tp-clickable:focus-visible {
            background: #eef5ff;
            border-color: #cfe2ff;
            outline: none;
        }

        .tp-clickable::after {
            content: "›";
            font-weight: 700;
            color: #7aa3d8;
            margin-left: 4px;
        }

        .tp-modal-sub { font-size: 0.76rem; color: #8a99ab; margin-top: 2px; }

        .tp-table-wrap {
            max-height: 46vh;
            overflow-y: auto;
            border: 1px solid #e3eaf3;
            border-radius: 10px;
        }

        .tp-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }

        .tp-table thead th {
            position: sticky;
            top: 0;
            background: #f5f8fc;
            border-bottom: 1px solid #e3eaf3;
            font-weight: 700;
            color: #43566b;
            font-size: 0.78rem;
            padding: 8px 10px;
            text-align: left;
            z-index: 1;
        }

        .tp-table tbody td {
            border-bottom: 1px solid #eef2f7;
            padding: 7px 10px;
            vertical-align: top;
        }

        .tp-table tbody tr:last-child td { border-bottom: 0; }
        .tp-table tbody tr:hover { background: #fafcff; }

        .tp-no { font-variant-numeric: tabular-nums; color: #45586e; white-space: nowrap; }
        .tp-name { color: #1f3045; }
        .tp-kind { color: #45586e; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .tp-amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: #1f3045; white-space: nowrap; }
        .tp-amt.minus { color: #d64045; }

        /* 공사명 아래 진행 날짜 — 금액에서 시선을 뺏지 않도록 작고 흐리게.
           (야간)만 살짝 진하게 해서 훑을 때 눈에 걸리도록 한다. */
        .tp-days {
            display: block;
            font-size: 0.72rem;
            color: #90a0b2;
            font-weight: 500;
            margin-top: 3px;
            line-height: 1.5;
            font-variant-numeric: tabular-nums;
        }

        .tp-days .n { color: #7b8ba0; }
        .tp-days .night { color: #55697e; font-weight: 700; }

        .tp-foot {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            background: #eef5ff;
            border: 1px solid #cfe2ff;
        }

        .tp-foot .lb { font-size: 0.84rem; font-weight: 700; color: #274a75; }
        .tp-foot .v { font-size: 1.05rem; font-weight: 800; color: #1b3c66; font-variant-numeric: tabular-nums; }
        .tp-foot .match { font-size: 0.71rem; color: #4a7ab5; font-weight: 600; margin-left: 8px; }

        /* 목표 상세 표의 정렬 가능한 머리글 */
        .tp-table thead th.tp-sort { cursor: pointer; user-select: none; white-space: nowrap; }
        .tp-table thead th.tp-sort:hover,
        .tp-table thead th.tp-sort:focus-visible { background: #e9f1fb; color: #274a75; outline: none; }

        .tp-empty {
            padding: 26px 14px;
            text-align: center;
            color: #8a99ab;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        .tp-error {
            padding: 22px 14px;
            text-align: center;
            color: #a8323a;
            background: #fdf1f2;
            border: 1px solid #f6d7da;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        /* ── 바로가기 ── */
        .mini-link-grid {
            /* 기본은 폭에 맞춰 칸 수 자동 — 홈 왼쪽 세로열에선 .shortcut-col 이 1열로 덮어씀 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
            gap: 8px;
            overflow-y: auto;
            min-height: 0;
        }

        .mini-link {
            border: 1px solid #d6e2ef;
            border-radius: 12px;
            background: #f8fbff;
            text-decoration: none;
            color: #1a3655;
            padding: 9px 6px;
            text-align: center;
            font-size: 0.76rem;
            font-weight: 700;
            transition: all 0.15s ease;
        }

        .mini-link:hover {
            background: #edf5ff;
            border-color: #b7cee7;
            transform: translateY(-1px);
        }

        .mini-link-favicon {
            width: 18px;
            height: 18px;
            display: block;
            margin: 0 auto 3px;
            border-radius: 4px;
            object-fit: cover;
        }

        .mini-link-icon-fallback {
            display: block;
            margin-bottom: 3px;
            font-size: 1.05rem;
            line-height: 1;
        }

        .login-card {
            width: min(420px, 92vw);
            border-radius: 12px;
        }

        /* 1600x900 미만 / 세로 짧은 화면: 스크롤 허용으로 폴백 */
        @media (max-width: 1200px), (max-height: 720px) {
            body { overflow: auto; }
            .home-shell {
                position: static;
                top: auto;
                padding: 70px 12px 16px;
            }
            /* 좁은 화면: 한 열로 쌓고 세로 스크롤 */
            .home-grid { grid-template-columns: 1fr; height: auto; }
            .home-right { grid-template-rows: auto auto; }
            .home-top { flex-direction: column; }
            .weather-mini { flex: 0 0 auto; }
            .shortcut-col .mini-link-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .tp-split { flex-direction: column; }
            .tp-split-donut { flex: 0 0 auto; }
            .tp-split-managers { border-left: 0; padding-left: 0; }
        }
    </style>
</head>

<body>
    <header class="home-header">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <h1 class="header-title">YEC</h1>
                    <div class="top-nav-shell">
                        <span class="top-nav-label">메뉴</span>
                        <nav class="app-top-nav" aria-label="주요 화면 이동">
                            <a href="/home.html" class="btn btn-sm btn-light">홈</a>
                            <a href="/dashboard.html" class="btn btn-sm btn-outline-light">월간 계획표</a>
                            <a href="/index.html" class="btn btn-sm btn-outline-light">AI 비서</a>
                            <a href="/admin.html" id="drawerAdminLink" class="btn btn-sm btn-outline-warning js-admin-only d-none">관리자</a>
                        </nav>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                    <span id="homeNowLabel" class="badge text-bg-light text-dark">-</span>
                    <span id="homeUserBadge" class="badge rounded-pill text-bg-primary d-none"></span>
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="home-shell">
        <!-- 2026-11-12 연간 PR-3: 1600×900 전자칠판 기준 재배치(설계 §3-4·§5-2).
             왼쪽 = 바로가기 세로 한 열, 오른쪽 위 = 총 공정률 + 날씨(소형), 오른쪽 아래 = 표 칸.
             표 칸은 PR-4에서 1~12월 표로 바뀐다 — 그때까지 기존 월 계획/실적 표(‹ ›)를 둔다.
             그래프 칸은 PR-5에서 표 칸 아래에 추가한다. -->
        <div class="home-grid">
            <!-- 왼쪽: 바로가기 세로 한 열 (id 유지로 home.js 렌더링 그대로 동작) -->
            <div class="home-card p-3 d-flex flex-column shortcut-col">
                <div class="section-title mb-2">바로가기</div>
                <div id="homeFrequentSiteList" class="mini-link-grid">
                    <div class="text-muted small">불러오는 중...</div>
                </div>
            </div>

            <div class="home-right">
                <!-- 오른쪽 위: 총 공정률(전체 + 담당자별) + 현장 날씨(소형) -->
                <div class="home-top">
                    <!-- 총 공정률 — 왼쪽 = 전체 도넛, 오른쪽 = 담당자별 진척(home.js renderManagerProgressHome) -->
                    <div class="home-card p-3 d-flex flex-column home-top-main">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div id="totalProgressTitle" class="section-title">6월 총 공정률</div>
                            <span class="badge text-bg-light border">목표 대비</span>
                        </div>
                        <div class="tp-split">
                            <div class="tp-split-donut">
                                <div id="totalProgressDonut" class="total-progress-donut no-settle">
                                    <div id="totalProgressInner" class="total-progress-inner"></div>
                                    <div class="total-progress-center">
                                        <div class="tp-center-row"><span class="k">시공</span><span id="totalProgressValue" class="total-progress-value">-</span></div>
                                        <div class="tp-center-row" id="totalProgressSettleRow"><span class="k">정산</span><span id="totalProgressSettleValue" class="total-progress-settle">-</span></div>
                                    </div>
                                </div>
                                <div class="total-progress-legend">
                                    <span><i class="dot-chip construction"></i>바깥 시공</span>
                                    <span id="totalProgressLegendSettle"><i class="dot-chip settlement"></i>안쪽 정산</span>
                                </div>
                                <div id="totalProgressAmount" class="total-progress-caption" style="margin-top:6px;font-weight:700;color:#1f3045;font-size:0.84rem;line-height:1.6;"></div>
                            </div>
                            <div class="tp-split-managers">
                                <div class="mgr-head">
                                    <span class="fw-bold">담당자별 진척</span>
                                    <span class="mgr-legend"><i class="dot-chip construction"></i>시공 <i class="dot-chip settlement"></i>정산</span>
                                </div>
                                <div id="managerProgressList" class="mgr-scroll">
                                    <div class="text-muted small">불러오는 중...</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 현장 날씨(소형) — 2026-11-12 축소: 예보·바람·습도·특보 줄 제거, /api/weather 호출은 그대로 -->
                    <div class="home-card p-3 d-flex flex-column weather-mini">
                        <div class="section-title mb-2">날씨 · <span id="weatherCity">안양</span></div>
                        <div class="weather-now">
                            <div class="weather-icon" id="weatherIcon">⛅</div>
                            <div class="weather-temp" id="weatherTemp">--°</div>
                        </div>
                        <div class="weather-cond" id="weatherCond">날씨 정보 연동 대기</div>
                        <div class="weather-cond">강수확률 <b id="weatherPop">--</b></div>
                    </div>
                </div>

                <!-- 오른쪽 아래: 표 칸 — PR-4 전까지 기존 월 계획/실적 표(2026-11-10).
                     ‹ › 는 표만이 아니라 도넛·담당자 그래프·상세 팝업을 같은 달로 함께 옮긴다(동작 무변경) -->
                <div class="home-card p-3 d-flex flex-column home-table-slot">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div class="section-title">계획 / 실적</div>
                        <div class="pa-nav">
                            <button type="button" id="planActualPrev" class="pa-nav-btn" aria-label="이전 달" disabled>‹</button>
                            <span id="planActualMonth" class="pa-nav-month">-</span>
                            <button type="button" id="planActualNext" class="pa-nav-btn" aria-label="다음 달" disabled>›</button>
                        </div>
                    </div>
                    <div id="planActualPeriod" class="pa-period">단위 천원</div>
                    <div id="planActualBody" class="pa-table">
                        <div class="text-muted small" style="grid-column: 1 / -1; text-align: left;">불러오는 중...</div>
                    </div>
                    <div id="planActualNotice" class="pa-notice" style="display:none;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 총 공정률 캡션의 '/ 목표' 클릭 시 뜨는 시공·정산 목표 상세 (종류는 home.js targetModalState.kind) -->
    <div class="modal fade" id="progressTargetModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title" id="progressTargetTitle">목표</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="progressTargetBody"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 총 공정률 '실적' 캡션 클릭 시 뜨는 공사별 상세 -->
    <div class="modal fade" id="progressActualModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <div>
                        <h5 class="modal-title" id="progressActualTitle">실적 상세</h5>
                        <div class="tp-modal-sub" id="progressActualSub"></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="progressActualBody"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 총 공정률 '정산' 캡션 클릭 시 뜨는 계산서(기성·준공) 상세 -->
    <div class="modal fade" id="progressSettlementModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <div>
                        <h5 class="modal-title" id="progressSettlementTitle">정산 상세</h5>
                        <div class="tp-modal-sub" id="progressSettlementSub"></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="progressSettlementBody"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="dashboardLoginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content login-card">
                <div class="modal-header">
                    <h5 class="modal-title">로그인</h5>
                </div>
                <div class="modal-body">
                    <p class="small text-muted mb-2">홈 화면 사용을 위해 카카오 계정으로 로그인해 주세요.</p>
                    <div id="dashboardLoginError" class="small text-danger mb-2" style="display: none;"></div>
                    <button type="button" class="btn btn-sm w-100 text-dark" style="background-color: #fee500;"
                        onclick="startKakaoLogin()">카카오로 로그인</button>
                </div>
                <div class="modal-footer">
                    <small class="text-muted text-center w-100">허용된 카카오 계정만 접속 가능합니다.</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="/dashboard.common.js?v=20260429"></script>
    <script src="/dashboard.auth.js?v=20260429"></script>
    <script src="/home.js?v=20261112a"></script>
</body>

</html>
