<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YJS 관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-card { border-radius: 12px; }
        .admin-topbar {
            background: #0f1724;
            color: #fff;
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.12);
        }
        .admin-shell {
            padding-top: 82px;
        }
        @media (max-width: 992px) {
            .admin-shell {
                padding-top: 122px;
            }
        }
        .app-top-nav { display: inline-flex; flex-wrap: wrap; gap: 6px; }
        .top-nav-shell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            background: rgba(255, 255, 255, 0.08);
        }
        .top-nav-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1;
        }
        .brand-mark {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1;
            transform: skewX(-12deg);
            display: inline-block;
            background: linear-gradient(180deg, #ff5a46 0%, #e32727 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 80, 60, 0.28);
        }
        .app-top-nav .btn { border-radius: 999px; font-size: 0.76rem; padding: 4px 10px; line-height: 1.2; min-width: 74px; font-weight: 700; }
        .app-top-nav .btn:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="bg-light">
<header class="admin-topbar">
    <div class="container-fluid px-3 px-md-4 d-flex justify-content-between align-items-center gap-2 flex-wrap">
        <h3 class="brand-mark">YEC</h3>
        <div class="d-flex gap-2 flex-wrap align-items-center">
            <div class="top-nav-shell">
                <span class="top-nav-label">메뉴</span>
                <nav class="app-top-nav" aria-label="주요 화면 이동">
                    <a href="/home.html" class="btn btn-sm btn-outline-light">홈</a>
                    <a href="/dashboard.html" class="btn btn-sm btn-outline-light">월간 계획표</a>
                    <a href="/index.html" class="btn btn-sm btn-outline-light">AI 비서</a>
                    <a href="/admin.html" class="btn btn-sm btn-light">관리자</a>
                </nav>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="runDailyExport()">백업데이터 생성</button>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">로그아웃</button>
        </div>
    </div>
</header>

<div class="container py-4 admin-shell">

    <div class="card mb-3 admin-card">
        <div class="card-header py-2">현장직 이름 (상황판 «작업 인원 추가» 목록)</div>
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small mb-0">이름 추가</label>
                    <input id="fieldStaffNameInput" class="form-control form-control-sm" placeholder="예: 홍길동">
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-sm btn-primary w-100" onclick="addFieldStaff()">등록</button>
                </div>
            </div>
            <div id="fieldStaffAdminList" class="mt-2 small text-muted">불러오는 중...</div>
        </div>
    </div>

    <div class="card mb-3 admin-card">
        <div class="card-header py-2">외출/행선표 인원 관리 (자유 등록/삭제)</div>
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small mb-0">이름 추가</label>
                    <input id="outingStaffNameInput" class="form-control form-control-sm" placeholder="예: 홍길동">
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-sm btn-primary w-100" onclick="addOutingStaff()">등록</button>
                </div>
            </div>
            <div id="outingStaffAdminList" class="mt-2 small text-muted">불러오는 중...</div>
        </div>
    </div>

    <div class="card mb-3 admin-card">
        <div class="card-header py-2">홈 화면 바로가기 사이트 관리</div>
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small mb-0">사이트 이름</label>
                    <input id="frequentSiteTitleInput" class="form-control form-control-sm" placeholder="예: 전자세금계산서">
                </div>
                <div class="col-md-6">
                    <label class="form-label small mb-0">URL</label>
                    <input id="frequentSiteUrlInput" class="form-control form-control-sm" placeholder="https://example.com">
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-sm btn-primary w-100" onclick="addFrequentSite()">등록</button>
                </div>
            </div>
            <div id="frequentSiteAdminList" class="mt-2 small text-muted">불러오는 중...</div>
        </div>
    </div>

    <div class="card mb-3 admin-card">
        <div class="card-header py-2">월별 총 공정률 목표 관리</div>
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small mb-0">대상 월</label>
                    <input id="monthlyProgressMonthInput" class="form-control form-control-sm" type="month">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-0">표시 라벨</label>
                    <input id="monthlyProgressLabelInput" class="form-control form-control-sm" placeholder="예: 7월">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-0">ERP 장애시 공정률(%)</label>
                    <input id="monthlyProgressRateInput" class="form-control form-control-sm" type="number" min="0" max="100" step="0.1">
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-0">목표금액(천원)</label>
                    <input id="monthlyProgressTargetInput" class="form-control form-control-sm" type="number" min="0" step="1">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="loadMonthlyProgressConfigAdmin()">조회</button>
                    <button type="button" class="btn btn-sm btn-primary w-50" onclick="saveMonthlyProgressConfigAdmin()">저장</button>
                </div>
            </div>
            <div id="monthlyProgressConfigStatus" class="mt-2 small text-muted">불러오는 중...</div>
        </div>
    </div>

    <div class="card mb-3 admin-card">
        <div class="card-header py-2">카카오 로그인 승인 대기</div>
        <div class="card-body py-2">
            <div class="small text-muted mb-2">처음 로그인한 카카오 계정은 여기에서 승인하면 즉시 접속할 수 있습니다.</div>
            <div id="loginAccessPendingList" class="small text-muted">불러오는 중...</div>
        </div>
    </div>

</div>

<div class="modal fade" id="exportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">백업데이터 생성 실행</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small mb-1">대상 날짜 (미입력 시 전일)</label>
                <input id="exportTargetDateInput" class="form-control form-control-sm" type="date">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-sm btn-primary" onclick="submitDailyExport()">실행</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let exportModal = null;

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    async function ensureAdminSession() {
        const res = await fetch('/api/auth/me');
        if (!res.ok) {
            alert('로그인이 필요합니다.');
            location.href = '/';
            return null;
        }
        const me = await res.json();
        if (me.role !== 'admin') {
            alert('관리자 권한이 필요합니다.');
            location.href = '/';
            return null;
        }
        return me;
    }

    async function loadFieldStaffAdmin() {
        const box = document.getElementById('fieldStaffAdminList');
        const res = await fetch('/api/schedules/field-staff');
        const data = await res.json();
        if (!res.ok) {
            box.textContent = data.detail || '목록을 불러오지 못했습니다.';
            return;
        }
        const rows = data.data || [];
        if (rows.length === 0) {
            box.innerHTML = '<span class="text-muted">등록된 이름이 없습니다.</span>';
            return;
        }
        box.innerHTML = rows.map((r) => `
            <div class="d-flex justify-content-between align-items-center border rounded px-2 py-1 mb-1">
                <span>${escapeHtml(r.name)}</span>
                <button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="deleteFieldStaff(${r.id})">삭제</button>
            </div>
        `).join('');
    }

    async function loadOutingStaffAdmin() {
        const box = document.getElementById('outingStaffAdminList');
        const res = await fetch('/api/schedules/outing-staff');
        const data = await res.json();
        if (!res.ok) {
            box.textContent = data.detail || '목록을 불러오지 못했습니다.';
            return;
        }
        const rows = data.data || [];
        if (rows.length === 0) {
            box.innerHTML = '<span class="text-muted">등록된 이름이 없습니다.</span>';
            return;
        }
        box.innerHTML = rows.map((r) => `
            <div class="d-flex justify-content-between align-items-center border rounded px-2 py-1 mb-1">
                <span>${escapeHtml(r.name)}</span>
                <button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="deleteOutingStaff(${r.id})">삭제</button>
            </div>
        `).join('');
    }

    async function addFieldStaff() {
        const name = document.getElementById('fieldStaffNameInput').value.trim();
        if (!name) {
            alert('이름을 입력하세요.');
            return;
        }
        const res = await fetch('/api/admin/field-staff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, sort_order: 0 })
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '등록 실패');
            return;
        }
        document.getElementById('fieldStaffNameInput').value = '';
        await loadFieldStaffAdmin();
    }

    async function deleteFieldStaff(id) {
        if (!confirm('삭제할까요?')) return;
        const res = await fetch(`/api/admin/field-staff/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '삭제 실패');
            return;
        }
        await loadFieldStaffAdmin();
    }

    async function addOutingStaff() {
        const name = document.getElementById('outingStaffNameInput').value.trim();
        if (!name) {
            alert('이름을 입력하세요.');
            return;
        }
        const res = await fetch('/api/admin/outing-staff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, sort_order: 0 })
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '등록 실패');
            return;
        }
        document.getElementById('outingStaffNameInput').value = '';
        await loadOutingStaffAdmin();
    }

    async function loadFrequentSiteAdmin() {
        const box = document.getElementById('frequentSiteAdminList');
        const res = await fetch('/api/admin/frequent-sites');
        const data = await res.json();
        if (!res.ok) {
            box.textContent = data.detail || '목록을 불러오지 못했습니다.';
            return;
        }
        const rows = data.data || [];
        if (rows.length === 0) {
            box.innerHTML = '<span class="text-muted">등록된 사이트가 없습니다.</span>';
            return;
        }
        box.innerHTML = rows.map((r) => `
            <div class="d-flex justify-content-between align-items-center border rounded px-2 py-1 mb-1 gap-2">
                <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a>
                <button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="deleteFrequentSite(${r.id})">삭제</button>
            </div>
        `).join('');
    }

    async function addFrequentSite() {
        const title = document.getElementById('frequentSiteTitleInput').value.trim();
        const url = document.getElementById('frequentSiteUrlInput').value.trim();
        if (!title) {
            alert('사이트 이름을 입력하세요.');
            return;
        }
        if (!url) {
            alert('URL을 입력하세요.');
            return;
        }
        const res = await fetch('/api/admin/frequent-sites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, url, sort_order: 0 })
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '등록 실패');
            return;
        }
        document.getElementById('frequentSiteTitleInput').value = '';
        document.getElementById('frequentSiteUrlInput').value = '';
        await loadFrequentSiteAdmin();
    }

    async function deleteFrequentSite(id) {
        if (!confirm('삭제할까요?')) return;
        const res = await fetch(`/api/admin/frequent-sites/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '삭제 실패');
            return;
        }
        await loadFrequentSiteAdmin();
    }

    function currentMonthValue() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function defaultMonthLabel(month) {
        const parts = String(month || '').split('-');
        const mm = Number(parts[1]);
        return Number.isFinite(mm) && mm >= 1 && mm <= 12 ? `${mm}월` : '';
    }

    function paintMonthlyProgressConfig(cfg) {
        const monthInput = document.getElementById('monthlyProgressMonthInput');
        const labelInput = document.getElementById('monthlyProgressLabelInput');
        const rateInput = document.getElementById('monthlyProgressRateInput');
        const targetInput = document.getElementById('monthlyProgressTargetInput');
        const status = document.getElementById('monthlyProgressConfigStatus');
        monthInput.value = cfg.month || monthInput.value || currentMonthValue();
        labelInput.value = cfg.label || defaultMonthLabel(monthInput.value);
        rateInput.value = cfg.total_progress ?? '';
        targetInput.value = cfg.target_amount_thousand ?? '';
        const targetText = Number(cfg.target_amount_thousand || 0).toLocaleString('ko-KR');
        status.innerHTML = `현재 설정: <b>${escapeHtml(labelInput.value)}</b> / 목표 <b>${targetText}천원</b> / ERP 장애시 공정률 <b>${escapeHtml(rateInput.value)}%</b>` +
            (cfg.updated_at ? ` <span class="text-muted">(최신화 ${escapeHtml(cfg.updated_at)})</span>` : '');
    }

    async function loadMonthlyProgressConfigAdmin() {
        const monthInput = document.getElementById('monthlyProgressMonthInput');
        if (!monthInput.value) monthInput.value = currentMonthValue();
        const status = document.getElementById('monthlyProgressConfigStatus');
        status.textContent = '불러오는 중...';
        const res = await fetch(`/api/admin/monthly-progress-config?month=${encodeURIComponent(monthInput.value)}`);
        const data = await res.json();
        if (!res.ok) {
            status.innerHTML = `<span class="text-danger">${escapeHtml(data.detail || '설정을 불러오지 못했습니다.')}</span>`;
            return;
        }
        paintMonthlyProgressConfig(data.data || {});
    }

    async function saveMonthlyProgressConfigAdmin() {
        const monthInput = document.getElementById('monthlyProgressMonthInput');
        const labelInput = document.getElementById('monthlyProgressLabelInput');
        const rateInput = document.getElementById('monthlyProgressRateInput');
        const targetInput = document.getElementById('monthlyProgressTargetInput');
        const month = monthInput.value || currentMonthValue();
        const payload = {
            month,
            label: labelInput.value.trim() || defaultMonthLabel(month),
            total_progress: Number(rateInput.value),
            target_amount_thousand: Number(targetInput.value)
        };
        if (!payload.month) {
            alert('대상 월을 선택하세요.');
            return;
        }
        if (!Number.isFinite(payload.total_progress) || payload.total_progress < 0 || payload.total_progress > 100) {
            alert('총 공정률은 0~100 사이 숫자로 입력하세요.');
            return;
        }
        if (!Number.isFinite(payload.target_amount_thousand) || payload.target_amount_thousand < 0) {
            alert('목표금액(천원)을 0 이상의 숫자로 입력하세요.');
            return;
        }
        const res = await fetch('/api/admin/monthly-progress-config', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '저장 실패');
            return;
        }
        paintMonthlyProgressConfig(data.data || payload);
        alert('월별 총 공정률 목표 설정을 저장했습니다.');
    }

    async function deleteOutingStaff(id) {
        if (!confirm('삭제할까요?')) return;
        const res = await fetch(`/api/admin/outing-staff/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '삭제 실패');
            return;
        }
        await loadOutingStaffAdmin();
    }

    async function loadLoginAccessRequests() {
        const box = document.getElementById('loginAccessPendingList');
        const res = await fetch('/api/admin/login-access-requests?status=pending');
        const data = await res.json();
        if (!res.ok) {
            box.innerHTML = `<span class="text-danger">${escapeHtml(data.detail || '목록을 불러오지 못했습니다.')}</span>`;
            return;
        }
        const rows = data.data || [];
        if (rows.length === 0) {
            box.innerHTML = '<span class="text-muted">대기 중인 계정이 없습니다.</span>';
            return;
        }
        box.innerHTML = rows.map((row) => `
            <div class="border rounded px-2 py-2 mb-2">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <div><b>${escapeHtml(row.user_name || '-')}</b></div>
                        <div class="text-muted">kakao_id: ${escapeHtml(row.kakao_id || '-')}</div>
                        <div class="text-muted">요청시각: ${escapeHtml(row.requested_at || '-')}</div>
                    </div>
                    <div class="d-flex gap-1">
                        <button type="button" class="btn btn-sm btn-success" onclick="reviewLoginAccessRequest(${row.id}, 'approve')">승인</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="reviewLoginAccessRequest(${row.id}, 'reject')">반려</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function reviewLoginAccessRequest(requestId, decision) {
        if (!requestId) return;
        if (decision === 'reject' && !confirm('이 계정 요청을 반려할까요?')) return;
        const payload = {
            decision,
            role: 'worker',
            note: decision === 'approve' ? '관리자 승인' : '관리자 반려'
        };
        const res = await fetch(`/api/admin/login-access-requests/${requestId}/review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '처리 실패');
            return;
        }
        alert(decision === 'approve' ? '승인 완료' : '반려 완료');
        await loadLoginAccessRequests();
    }

    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/';
    }

    function runDailyExport() {
        document.getElementById('exportTargetDateInput').value = '';
        exportModal.show();
    }

    async function submitDailyExport() {
        const targetDate = document.getElementById('exportTargetDateInput').value.trim();
        const payload = { target_date: targetDate || null };
        const res = await fetch('/api/admin/export/daily', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.detail || '백업데이터 생성 실패');
            return;
        }
        exportModal.hide();
        alert(`백업데이터 생성 완료: ${data.data.output_file}`);
    }

    ensureAdminSession().then((ok) => {
        if (!ok) return;
        exportModal = new bootstrap.Modal(document.getElementById('exportModal'));
        loadFieldStaffAdmin();
        loadOutingStaffAdmin();
        loadFrequentSiteAdmin();
        loadMonthlyProgressConfigAdmin();
        loadLoginAccessRequests();
    });
</script>
</body>
</html>
